name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: sia-autoscale-runners
    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [11]
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install NodeJS
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          require-lockfile: true
          version: ^${{ matrix.pnpm-version }}
        env:
          pnpm_config__auth: |
            {
              "https://npm.pkg.github.com": {
                "@ungdev": {
                  "authToken": "${{ secrets.GITHUB_TOKEN }}"
                }
              }
            }
      - run: pnpm prisma generate
      - run: pnpm lint

  build:
    runs-on: sia-autoscale-runners
    needs: lint
    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [11]
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install NodeJS
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          require-lockfile: true
          version: ^${{ matrix.pnpm-version }}
        env:
          pnpm_config__auth: |
            {
              "https://npm.pkg.github.com": {
                "@ungdev": {
                  "authToken": "${{ secrets.GITHUB_TOKEN }}"
                }
              }
            }
      - run: pnpm prisma generate
      - run: pnpm build

  docs:
    runs-on: sia-autoscale-runners
    needs: build
    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [11]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ matrix.pnpm-version }}
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Use Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pnpm build:docs:configure
      - run: pnpm build:docs

  test:
    runs-on: sia-static-runners
    needs: build
    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [11]
    permissions:
      packages: read
    env:
      DATABASE_URL: mysql://dev:dev@localhost:3306/etuutt_test
    services:
      mariadb:
        image: mariadb:10
        env:
          MYSQL_USER: 'dev'
          MYSQL_PASSWORD: 'dev'
          MYSQL_DATABASE: etuutt_test
          MYSQL_RANDOM_ROOT_PASSWORD: yes
        ports:
          - 3306:3306
        options: >-
          --name mariadb
          --health-cmd="mysqladmin ping"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=10
          --tmpfs /var/lib/mysql:rw

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install NodeJS
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          require-lockfile: true
          version: ^${{ matrix.pnpm-version }}
        env:
          pnpm_config__auth: |
            {
              "https://npm.pkg.github.com": {
                "@ungdev": {
                  "authToken": "${{ secrets.GITHUB_TOKEN }}"
                }
              }
            }
      - run: cp .env.test.dist .env.test
      - run: pnpm test:db:reset
      - run: pnpm test:cov
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: sia-static-runners
    needs:
      - test
      - docs
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install docker
        uses: docker/setup-buildx-action@v4
      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          build-args: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/etuutt/api:${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
